[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sqd-gpu-metal"
version = "1.5.0"
description = "Native MLX/Metal Selected Basis Diagonalization for Apple Silicon"
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
authors = [{name = "TyxonQ contributors"}]
dependencies = [
  "numpy>=1.26",
  "pyscf>=2.4",
  "mlx>=0.32.4; platform_system == 'Darwin' and platform_machine == 'arm64'",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: Apache Software License",
  "Operating System :: MacOS :: MacOS X",
  "Programming Language :: Python :: 3",
  "Topic :: Scientific/Engineering :: Chemistry",
]

[project.urls]
TyxonQ = "https://github.com/QureGenAI-Biotech/TyxonQ"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["sqd_gpu_metal"]

[tool.setuptools.package-data]
sqd_gpu_metal = ["kernels.metal"]
